[project]
name = "geotec"
version = "0.1.0"
description = "Sistema automatizado de aquisicao (IoT) e analise de dados dos ensaios de cisalhamento direto e triaxial"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tiago Naves de Oliveira Alves", email = "tiagonaves2003@gmail.com" }]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jupyter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
